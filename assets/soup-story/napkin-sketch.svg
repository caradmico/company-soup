<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">Napkin sketch of a coffee cup with a thermometer</title>
  <desc id="d1">Rough ink drawing on warm paper: a mug, a side thermometer, and a scribbled how-hot note.</desc>
  <defs>
    <filter id="paper" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
    <clipPath id="sheet"><rect x="18" y="16" width="524" height="368" rx="10"/></clipPath>
  </defs>
  <rect width="560" height="400" fill="#e8c9a0"/>
  <g filter="url(#paper)" clip-path="url(#sheet)">
    <rect x="18" y="16" width="524" height="368" rx="10" fill="#f3ddc0"/>
    <path d="M40 28h480M36 48h488M44 68h470" stroke="#d7b48a" stroke-width="1.1" opacity=".55"/>
    <path d="M52 88h20M80 88h14M102 88h28" stroke="#c9a57a" stroke-width="1" opacity=".4"/>
    <!-- coffee ring -->
    <ellipse cx="118" cy="86" rx="42" ry="38" fill="none" stroke="#b07a4a" stroke-width="3.2" opacity=".28"/>
    <ellipse cx="118" cy="86" rx="34" ry="30" fill="none" stroke="#c48a58" stroke-width="1.4" opacity=".2"/>
    <!-- mug body, double-stroked, imperfect -->
    <path d="M198 132c-6 8-10 28-11 58-1 34 3 78 8 104 2 12 18 20 52 22 38 2 92 1 128-2 22-2 36-12 38-24 6-28 10-72 9-108 0-32-6-50-14-58-8-8-28-12-70-12-46 0-88 2-110 6-12 2-24 8-30 14z"
          fill="none" stroke="#1c1917" stroke-width="3.1" stroke-linejoin="round"/>
    <path d="M206 138c-4 10-8 26-9 54-1 36 2 76 7 100 3 14 20 16 50 18 40 2 88 0 122-3 18-2 30-10 32-20 5-26 9-70 8-104-1-28-5-46-12-52"
          fill="none" stroke="#1c1917" stroke-width="1.15" opacity=".55"/>
    <!-- rim -->
    <ellipse cx="308" cy="136" rx="108" ry="28" fill="none" stroke="#1c1917" stroke-width="2.8"/>
    <ellipse cx="308" cy="136" rx="88" ry="18" fill="none" stroke="#1c1917" stroke-width="1.4" opacity=".7"/>
    <!-- coffee surface -->
    <ellipse cx="308" cy="138" rx="78" ry="14" fill="#1c1917" opacity=".12"/>
    <!-- handle -->
    <path d="M418 168c48 8 62 38 58 78-4 38-28 62-70 70" fill="none" stroke="#1c1917" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M424 180c34 8 44 30 40 62-3 26-18 44-50 52" fill="none" stroke="#1c1917" stroke-width="1.3" opacity=".5"/>
    <!-- thermometer on the outside -->
    <rect x="248" y="168" width="18" height="118" rx="9" fill="none" stroke="#1c1917" stroke-width="2.4"/>
    <circle cx="257" cy="292" r="16" fill="none" stroke="#1c1917" stroke-width="2.6"/>
    <path d="M257 184v92" stroke="#1c1917" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M252 198h10M252 214h10M252 230h8M252 246h10M252 262h8" stroke="#1c1917" stroke-width="1.5"/>
    <circle cx="257" cy="292" r="7" fill="#1c1917"/>
    <!-- sketch arrows + notes -->
    <path d="M196 214c-22-4-40-2-52 10" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M148 218l-8 8 12 1" fill="none" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="208" fill="#1c1917" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" transform="rotate(-8 78 208)">thermo</text>
    <text x="86" y="226" fill="#1c1917" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" transform="rotate(-7 86 226)">on the OUTSIDE</text>
    <text x="392" y="118" fill="#1c1917" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="800" transform="rotate(6 392 118)">how hot??</text>
    <path d="M430 124c8 10 14 22 12 36" fill="none" stroke="#1c1917" stroke-width="1.5"/>
    <!-- steam scribbles -->
    <path d="M274 108c6-14 2-22 8-34M308 102c4-16-2-24 6-36M338 110c6-12 0-22 8-32" fill="none" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
    <!-- hatch shading -->
    <path d="M220 250l14 18M228 262l12 16M236 274l10 14M372 248l12 16M380 262l10 14" stroke="#1c1917" stroke-width="1.1" opacity=".35"/>
  </g>
  <rect x="18" y="16" width="524" height="368" rx="10" fill="none" stroke="#c4a078" stroke-width="1.2"/>
</svg>
