<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">Finished thermometer mug handed over a store counter</title>
  <desc id="d3">Anonymous hands hold a finished mug with an exterior temperature strip; a counter and receipt mark the sale.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fafaf9"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c4a4"/>
      <stop offset="1" stop-color="#c9855c"/>
    </linearGradient>
  </defs>
  <rect width="560" height="400" fill="url(#wash)"/>
  <!-- store glow -->
  <ellipse cx="300" cy="40" rx="180" ry="50" fill="#f59e0b" opacity=".12"/>
  <!-- counter -->
  <rect x="0" y="292" width="560" height="108" fill="#44403c"/>
  <rect x="0" y="292" width="560" height="14" fill="#57534e"/>
  <rect x="0" y="306" width="560" height="6" fill="#f59e0b" opacity=".35"/>
  <!-- receipt -->
  <g transform="translate(28 214) rotate(-8)">
    <rect width="86" height="92" fill="#fafaf9" stroke="#d6d3d1"/>
    <path d="M10 14h66M10 22h50M10 36h66M10 46h40M10 62h66" stroke="#a8a29e" stroke-width="2"/>
    <text x="10" y="80" fill="#1c1917" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">1× THERMO MUG</text>
  </g>
  <!-- paper bag -->
  <path d="M430 248h92l-8 80h-76z" fill="#d6d3d1"/>
  <path d="M438 248v-16h76v16" fill="none" stroke="#a8a29e" stroke-width="3"/>
  <rect x="454" y="268" width="44" height="28" rx="3" fill="#fafaf9"/>
  <text x="460" y="286" fill="#1c1917" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="800">SOLD</text>

  <!-- left hand (receiving / holding) -->
  <g fill="url(#skin)" stroke="#1c1917" stroke-width="1.6" stroke-linejoin="round">
    <ellipse cx="168" cy="268" rx="54" ry="28"/>
    <rect x="128" y="230" width="22" height="52" rx="11"/>
    <rect x="152" y="220" width="20" height="58" rx="10"/>
    <rect x="174" y="224" width="20" height="54" rx="10"/>
    <rect x="196" y="236" width="18" height="42" rx="9"/>
  </g>
  <!-- right hand -->
  <g fill="url(#skin)" stroke="#1c1917" stroke-width="1.6" stroke-linejoin="round">
    <ellipse cx="392" cy="274" rx="58" ry="30"/>
    <rect x="348" y="232" width="20" height="56" rx="10"/>
    <rect x="370" y="220" width="22" height="62" rx="11"/>
    <rect x="394" y="226" width="20" height="56" rx="10"/>
    <rect x="416" y="240" width="18" height="44" rx="9"/>
  </g>

  <!-- mug -->
  <g>
    <path d="M214 118c-6 10-10 36-10 70s4 78 10 96c4 12 22 18 66 18h36c44 0 62-6 66-18 6-18 10-60 10-96s-4-60-10-70c-6-10-24-16-72-16s-66 6-72 16z" fill="url(#mug)" stroke="#1c1917" stroke-width="2.2"/>
    <ellipse cx="280" cy="118" rx="86" ry="22" fill="#fafaf9" stroke="#1c1917" stroke-width="2.2"/>
    <ellipse cx="280" cy="118" rx="68" ry="14" fill="url(#coffee)"/>
    <path d="M366 148c40 10 50 36 46 70-4 32-22 52-54 60" fill="none" stroke="#1c1917" stroke-width="8" stroke-linecap="round"/>
    <path d="M366 148c40 10 50 36 46 70-4 32-22 52-54 60" fill="none" stroke="#fafaf9" stroke-width="3.2" stroke-linecap="round"/>
    <!-- thermometer strip on the outside -->
    <rect x="248" y="148" width="28" height="108" rx="6" fill="#1c1917"/>
    <rect x="252" y="152" width="20" height="78" rx="3" fill="#fafaf9"/>
    <path d="M256 164h12M256 176h12M256 188h12M256 200h8M256 212h12" stroke="#78716c" stroke-width="1.4"/>
    <rect x="254" y="218" width="16" height="8" rx="1" fill="#f59e0b"/>
    <circle cx="262" cy="244" r="8" fill="#f59e0b"/>
    <text x="284" y="196" fill="#1c1917" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="800">72°</text>
    <!-- steam -->
    <path d="M250 96c8-16 2-24 10-40M280 90c6-18-2-26 8-42M308 96c8-14 0-24 10-38" fill="none" stroke="#a8a29e" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- cuff hints, not a portrait -->
  <rect x="108" y="268" width="46" height="36" rx="8" fill="#1c1917"/>
  <rect x="398" y="272" width="50" height="34" rx="8" fill="#1c1917"/>
</svg>
