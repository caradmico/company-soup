<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Soup · Cook an idea → ship a thing</title>
<meta name="description" content="Cook an idea → ship a thing. Send what you want to make. Jarvis returns a short soup-to-nuts brief and estimate later.">
<link rel="canonical" href="https://caradmico.github.io/company-soup/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1c1917;
  --amber:#f59e0b;
  --chalk:#fafaf9;
  --stone:#292524;
  --mute:#a8a29e;
  --line:#44403c;
  /* blueprint cyan #0891b2 is locked to the blueprint beat only — do not use on the page chrome */
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  color:var(--chalk);
  background:
    radial-gradient(ellipse 70% 50% at 90% -20%,rgba(245,158,11,.16),transparent 52%),
    radial-gradient(ellipse 50% 40% at 0% 10%,rgba(245,158,11,.06),transparent 46%),
    var(--charcoal);
  font:16.5px/1.5 Manrope,system-ui,sans-serif;
}
.wrap{width:min(48rem,calc(100% - 2rem));margin-inline:auto}
header{
  padding:1.1rem 0 1rem;
  border-bottom:1px solid var(--line);
}
.brand{
  margin:0;
  font:500 .72rem/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--amber);
}

.hero{padding:1.5rem 0 1.7rem}
h1{
  margin:.15rem 0 .5rem;
  font-size:clamp(2.05rem,6vw,3.15rem);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1.02;
}
.why{
  margin:0 0 1.25rem;
  max-width:36rem;
  font-size:1.08rem;
  font-weight:600;
  color:var(--chalk);
}
.why span{color:var(--amber)}

.story{
  display:grid;
  gap:.7rem;
  margin:0 0 1.4rem;
}
@media(min-width:720px){.story{grid-template-columns:1fr 1fr 1fr}}
.beat{
  margin:0;
  background:var(--stone);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}
.beat img{display:block;width:100%;height:auto;aspect-ratio:7/5;object-fit:cover;background:#292524}
.beat figcaption{
  padding:.7rem .8rem .85rem;
  border-top:1px solid var(--line);
}
.beat .n{
  display:block;
  margin:0 0 .28rem;
  font:500 .66rem/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--amber);
}
.beat p{margin:0;font-size:.95rem;font-weight:700;letter-spacing:-.02em}

.intake{
  background:var(--stone);
  border:1px solid var(--line);
  border-radius:16px;
  padding:1.1rem 1.05rem 1.2rem;
  box-shadow:0 0 0 1px rgba(245,158,11,.08),0 18px 50px rgba(0,0,0,.28);
}
label{display:block;font-size:.85rem;font-weight:700;margin:0 0 .35rem}
textarea{
  width:100%;
  min-height:8rem;
  padding:.75rem .8rem;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0c0a09;
  color:var(--chalk);
  font:inherit;
  resize:vertical;
}
textarea:focus{outline:2px solid var(--amber);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:.8rem;align-items:center}
button{
  appearance:none;
  border:0;
  cursor:pointer;
  background:var(--amber);
  color:#1c1917;
  font:800 1.05rem/1 Manrope,system-ui,sans-serif;
  letter-spacing:-.02em;
  padding:.85rem 1.25rem;
  border-radius:12px;
  box-shadow:0 0 0 1px rgba(245,158,11,.35),0 10px 28px rgba(245,158,11,.22);
}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:wait;filter:none}
#note{
  display:none;
  margin:.9rem 0 0;
  padding:.75rem .8rem;
  border-radius:10px;
  font-size:.95rem;
  font-weight:600;
}
#note.visible{display:block}
#note.ok{
  background:#0c0a09;
  border:1px solid var(--amber);
  color:var(--chalk);
}
#note.err{
  background:#0c0a09;
  border:1px solid var(--mute);
  color:var(--chalk);
}

footer{
  padding:1.1rem 0 2rem;
  border-top:1px solid var(--line);
  color:var(--mute);
  font-size:.9rem;
}
</style>
</head>
<body>
<!-- PARK: idea-tied API · trained advice bot · fee scale · comps-research bot (do not hallucinate competitor lists) -->
<div class="wrap">
<header>
  <p class="brand">Company Soup</p>
</header>

<section class="hero">
  <h1>Cook an idea → ship a thing.</h1>
  <p class="why">Paste what you want to make. We take it to the pot. Jarvis sends a short soup-to-nuts brief and an estimate <span>later</span> — not a demo on this page.</p>

  <div class="story" aria-label="Idea to object, three beats">
    <figure class="beat">
      <img src="assets/soup-story/napkin-sketch.png" alt="Unfinished napkin doodle of a cup, a thermometer, and the word temp?" width="560" height="400">
      <figcaption>
        <span class="n">1 · Sketch</span>
        <p>Napkin: cup + thermometer.</p>
      </figcaption>
    </figure>
    <figure class="beat">
      <img src="assets/soup-story/blueprint.png" alt="CAD drawing of the travel mug with mount-band and thermometer strip." width="560" height="400">
      <figcaption>
        <span class="n">2 · CAD</span>
        <p>Readout, mount, parts.</p>
      </figcaption>
    </figure>
    <figure class="beat">
      <img src="assets/soup-story/in-hands.png" alt="Close-up of a hand pulling a thermometer mug off a wooden shelf." width="560" height="400">
      <figcaption>
        <span class="n">3 · In hands</span>
        <p>A mug you can sell.</p>
      </figcaption>
    </figure>
  </div>

  <!-- Inbox path = jarvis-operator ops/soup-ideas.json via https://soup-intake.pages.dev/api/soup-idea -->
  <form class="intake" id="intake" novalidate>
    <label for="idea">Your idea</label>
    <textarea id="idea" name="text" rows="5" maxlength="4000" required placeholder="What do you want to make?"></textarea>
    <div class="actions">
      <button type="submit" id="send">Send the idea</button>
    </div>
    <p id="note" role="status" aria-live="polite"></p>
  </form>
</section>

<footer>
  Company Soup · cook an idea → ship a thing.
</footer>
</div>
<script>
const INBOX = "https://soup-intake.pages.dev/api/soup-idea";
const form = document.getElementById("intake");
const idea = document.getElementById("idea");
const send = document.getElementById("send");
const note = document.getElementById("note");

function showNote(kind, text){
  note.className = "visible " + kind;
  note.textContent = text;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = idea.value.trim();
  if(!text){
    showNote("err", "Write the idea first.");
    idea.focus();
    return;
  }

  send.disabled = true;
  showNote("err", "Sending…");

  try {
    const res = await fetch(INBOX, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, ts: new Date().toISOString() })
    });
    if(!res.ok) throw new Error("bad status");
    showNote("ok", "Idea received. Jarvis returns a short soup-to-nuts brief + estimate later.");
    idea.value = "";
  } catch {
    showNote("err", "Couldn’t send just now. Try again in a moment.");
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
