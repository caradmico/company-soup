<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course · Grant Desk</title>
<meta name="description" content="A paid grant writing day class (~$250). Pay before materials. About 10 hours of resource access over 12 months.">
<link rel="canonical" href="https://caradmico.github.io/company-soup/brands/grant-desk/course/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2430;
  --paper:#f7f5f1;
  --navy:#1e3a5f;
  --ribbon:#6b4f2a;
  --mute:#5a6570;
  --line:#d8d2c8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);
  background:var(--paper);
  font:400 18px/1.45 "Source Sans 3","Segoe UI",system-ui,sans-serif;
}
.hero{
  position:relative;
  min-height:min(52svh,28rem);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:1.35rem 1.25rem 2rem;
  background:
    linear-gradient(180deg,rgba(28,36,48,.18) 0%,rgba(28,36,48,.05) 28%,rgba(28,36,48,.12) 100%),
    #3a2a18 url("../assets/hero-flowers-sunset.png") center/cover no-repeat;
}
.mark{margin:0}
.mark a{
  color:#fff;
  text-decoration:none;
  font:650 1rem/1 "Source Sans 3",system-ui,sans-serif;
  letter-spacing:.02em;
  text-shadow:0 1px 8px rgba(28,36,48,.35);
}
.mark a:hover{text-decoration:underline;text-underline-offset:.16em}
.hero h1{
  margin:0;
  max-width:14ch;
  padding:1.05rem 1.15rem 1.15rem;
  background:#fff;
  color:var(--navy);
  font-size:clamp(1.85rem,6.4vw,3.15rem);
  font-weight:700;
  line-height:1.02;
  letter-spacing:-.03em;
}
.band{max-width:34rem;margin:0 auto;padding:2.6rem 1.35rem 2.2rem;text-align:center}
.ethos{
  margin:0 0 2.4rem;
  color:var(--navy);
  font-size:clamp(1.15rem,2.4vw,1.35rem);
  font-weight:600;
  line-height:1.35;
}
.blocks{margin:0;padding:0;list-style:none}
.blocks li{
  margin:0;
  padding:1.15rem 0;
  border-top:1px solid var(--navy);
  color:var(--navy);
  font-size:clamp(1.2rem,2.6vw,1.45rem);
  font-weight:650;
  letter-spacing:-.015em;
}
.blocks li:last-child{border-bottom:1px solid var(--navy)}
footer{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.1rem;
  padding:0 1.35rem 3.6rem;
}
.mail{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:3.2rem;
  padding:.8rem 1.5rem;
  background:var(--navy);
  color:#fff!important;
  text-decoration:none;
  font-weight:700;
  font-size:1.05rem;
}
.mail:hover{filter:brightness(1.08)}
.note{margin:0;color:var(--mute);font-size:.95rem}
@media(min-width:720px){
  .hero{padding:1.7rem 2.4rem 2.6rem}
  .band{padding:3.2rem 1.5rem 2.6rem}
}
</style>
</head>
<body>
<section class="hero">
  <p class="mark"><a href="../">Grant Desk</a></p>
  <h1>Know which door to knock on.</h1>
</section>

<div class="band">
  <p class="ethos">A paid day class. Then a year of access.</p>
  <ul class="blocks">
    <li>~$250</li>
    <li>pay before materials</li>
    <li>~10 hours over 12 months</li>
  </ul>
</div>

<footer>
  <a class="mail" href="mailto:caradmico@gmail.com?subject=Grant%20Desk%20%E2%80%94%20enroll%20/%20sign%20up&amp;body=Grant%20Desk%20%E2%80%94%20enroll%20/%20sign%20up%0A%0AOrg%3A%0AName%3A%0AWhen%20you%20want%20the%20day%3A%0A%0Ahttps%3A//grants.graphicoregon.com/course/">Enroll / Sign up</a>
  <p class="note">Pay first. Then the day, and about 10 hours of resource access over 12 months.</p>
</footer>
</body>
</html>
